name: Gear5 UI

# Gear5 UI now lives in gear5/. Root-level workflows are the only ones GitHub
# runs, so this stays here and reaches into the subdirectory.

on:
  push:
    branches: [main]
    paths:
      - "gear5/**"
      - ".github/workflows/gear5.yml"
  pull_request:
    paths:
      - "gear5/**"
      - ".github/workflows/gear5.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: gear5

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: gear5/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
