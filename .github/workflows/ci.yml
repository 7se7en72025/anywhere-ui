name: CI

# Anywhere UI, at the repository root.
#
# The size budgets, axe assertions, and locale coverage the README claims are
# enforced here — every one of them is an assertion in this test run, and the
# measured gzipped size of each component is printed in the log.

on:
  push:
    branches: [main]
    paths-ignore:
      - "gear5/**"
      - ".github/workflows/gear5.yml"
  pull_request:
    paths-ignore:
      - "gear5/**"
      - ".github/workflows/gear5.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
