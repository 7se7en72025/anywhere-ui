<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="voyage-title voyage-desc">
  <title id="voyage-title">A small ship sailing toward the horizon at sunset</title>
  <desc id="voyage-desc">An original cel-shaded illustration: a single-masted ship crosses a wide ocean beneath a low sun, with layered clouds, sun rays, and a flock of birds.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2b52" />
      <stop offset="38%" stop-color="#a2557a" />
      <stop offset="68%" stop-color="#e08a5a" />
      <stop offset="100%" stop-color="#f2c078" />
    </linearGradient>

    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6a463" />
      <stop offset="18%" stop-color="#2f6b74" />
      <stop offset="100%" stop-color="#0c4243" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#f7c479" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f7c479" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe4a8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffe4a8" stop-opacity="0" />
    </linearGradient>

    <clipPath id="seaClip">
      <rect x="0" y="392" width="1200" height="283" />
    </clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)" />

  <!-- Sun and its bloom, sitting just above the horizon line. -->
  <circle cx="812" cy="392" r="210" fill="url(#sunGlow)" />
  <circle cx="812" cy="376" r="74" fill="#ffe9b0" />

  <!-- Anime sun rays: hard-edged wedges radiating from the sun. -->
  <g fill="#ffe4a8" opacity="0.22">
    <path d="M812 376 L1200 96 L1200 240 Z" />
    <path d="M812 376 L1120 40 L1220 130 Z" />
    <path d="M812 376 L560 40 L470 120 Z" />
    <path d="M812 376 L300 150 L250 250 Z" />
    <path d="M812 376 L980 20 L1060 60 Z" />
  </g>

  <!-- Layered cel-shaded clouds, lightest nearest the sun. -->
  <g opacity="0.92">
    <path d="M0 176 q70-40 150-22 q60-46 148-24 q66-40 140-6 q-40 34-120 34 q-92 10-160-6 q-96 22-158 24 Z" fill="#c9a2c2" opacity="0.55" />
    <path d="M980 128 q56-34 124-16 q52-34 96-6 q-34 30-104 30 q-72 8-116-8 Z" fill="#f0c4a8" opacity="0.6" />
    <path d="M120 268 q92-48 196-22 q78-42 176-14 q-52 36-160 36 q-118 10-212-0 Z" fill="#e3a894" opacity="0.5" />
    <path d="M640 232 q76-38 158-14 q64-30 124-4 q-44 28-136 28 q-96 6-146-10 Z" fill="#f7d3a0" opacity="0.55" />
  </g>

  <!-- Distant flock, small and staggered so it reads as depth. -->
  <g stroke="#4a2f3d" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M232 156 q12-11 24 0 q12-11 24 0" />
    <path d="M296 190 q9-8 18 0 q9-8 18 0" />
    <path d="M186 208 q7-7 14 0 q7-7 14 0" />
  </g>

  <!-- Sea. -->
  <rect x="0" y="392" width="1200" height="283" fill="url(#sea)" />

  <!-- Sun glint on the water, narrowing toward the horizon. -->
  <g clip-path="url(#seaClip)">
    <path d="M812 392 L1000 675 L624 675 Z" fill="url(#glint)" opacity="0.5" />
    <g fill="#ffe4a8" opacity="0.5">
      <rect x="742" y="416" width="140" height="6" rx="3" />
      <rect x="716" y="446" width="192" height="7" rx="3.5" />
      <rect x="688" y="482" width="248" height="8" rx="4" />
      <rect x="652" y="524" width="320" height="9" rx="4.5" />
      <rect x="606" y="574" width="412" height="10" rx="5" />
      <rect x="552" y="632" width="520" height="11" rx="5.5" />
    </g>
  </g>

  <!-- Stylised wave bands, darkening toward the viewer. -->
  <g clip-path="url(#seaClip)">
    <path d="M0 470 q90-22 180 0 q90 22 180 0 q90-22 180 0 q90 22 180 0 q90-22 180 0 q90 22 180 0 v40 H0 Z" fill="#1f5a5e" opacity="0.55" />
    <path d="M0 548 q110-26 220 0 q110 26 220 0 q110-26 220 0 q110 26 220 0 q110-26 220 0 v60 H0 Z" fill="#134a4d" opacity="0.7" />
    <path d="M0 626 q130-30 260 0 q130 30 260 0 q130-30 260 0 q130 30 260 0 v60 H0 Z" fill="#0a3739" opacity="0.85" />
  </g>

  <!-- The ship: small on purpose, so the ocean carries the frame. -->
  <g transform="translate(392 392)">
    <!-- Mast and rigging. -->
    <path d="M0 0 L0 -150" stroke="#3a2420" stroke-width="5" stroke-linecap="round" />
    <path d="M0 -150 L-46 -6 M0 -150 L46 -6" stroke="#3a2420" stroke-width="2" opacity="0.65" />

    <!-- Mainsail, belly curved as if full of wind. -->
    <path d="M-6 -142 q-84 44-70 122 q42 14 70 8 Z" fill="#f6efe2" />
    <path d="M-6 -142 q-84 44-70 122 q42 14 70 8 Z" fill="#d8b48c" opacity="0.35" />
    <path d="M6 -128 q64 38 54 100 q-30 12-54 8 Z" fill="#fbf6ec" />

    <!-- Pennant. -->
    <path d="M2 -150 q34 8 46 18 q-16 8-46 8 Z" fill="#8f3550" />

    <!-- Hull. -->
    <path d="M-84 -6 q84 34 168 0 q-22 44-84 44 q-62 0-84-44 Z" fill="#4a2c26" />
    <path d="M-84 -6 q84 22 168 0 q-8 14-84 14 q-76 0-84-14 Z" fill="#6b4033" />

    <!-- Bow wake. -->
    <path d="M-98 34 q34 12 74 12 q40 0 74-12 q-30 22-74 22 q-44 0-74-22 Z" fill="#eaf3f0" opacity="0.5" />
  </g>

  <!-- Foam flecks, sparse so the eye still lands on the ship. -->
  <g fill="#eaf3f0" opacity="0.4">
    <ellipse cx="188" cy="512" rx="22" ry="4" />
    <ellipse cx="146" cy="586" rx="30" ry="5" />
    <ellipse cx="988" cy="540" rx="26" ry="4" />
    <ellipse cx="1064" cy="614" rx="34" ry="5" />
    <ellipse cx="286" cy="648" rx="30" ry="5" />
  </g>
</svg>
